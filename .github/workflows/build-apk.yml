name: Build ShenSandu APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
     
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
     
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
     
      - name: Clean
        run: rm -rf android www node_modules package-lock.json
     
      - name: Make www folder
        run: |
          mkdir www
          cp index.html app.js style.css manifest.json www/ 2>/dev/null || true
          cp -r *.png *.jpg www/ 2>/dev/null || true
          echo "www files:" && ls www/
     
      - name: Build APK with Capacitor 6
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init ShenSandu com.shehara.shensandu --web-dir=www
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
     
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShenSandu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
